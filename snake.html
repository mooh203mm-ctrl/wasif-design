<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الثعبان - واصف</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: lime;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 { margin: 10px; }
    canvas {
      border: 2px solid lime;
      background: black;
    }
    #score { font-size: 20px; margin: 10px; }
    button {
      background: lime;
      color: black;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>لعبة الثعبان 🐍</h1>
  <div id="score">النقاط: 0</div>
  <canvas id="game" width="300" height="300"></canvas>
  <button onclick="startGame()">ابدأ من جديد</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score');

    let snake = [{x: 150, y: 150}];
    let food = {x: 0, y: 0};
    let dx = 15;
    let dy = 0;
    let score = 0;
    let game;

    function randomFood() {
      food.x = Math.floor(Math.random() * 20) * 15;
      food.y = Math.floor(Math.random() * 20) * 15;
    }

    function draw() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, 300, 300);

      ctx.fillStyle = 'red';
      ctx.fillRect(food.x, food.y, 15, 15);

      ctx.fillStyle = 'lime';
      snake.forEach(part => {
        ctx.fillRect(part.x, part.y, 15, 15);
      });

      let head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreText.innerHTML = 'النقاط: ' + score;
        randomFood();
      } else {
        snake.pop();
      }

      if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) {
        clearInterval(game);
        alert('انتهت اللعبة! نقاطك: ' + score);
      }
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          clearInterval(game);
          alert('انتهت اللعبة! ضربت نفسك. نقاطك: ' + score);
        }
      }
    }

    function startGame() {
      snake = [{x: 150, y: 150}];
      dx = 15; dy = 0; score = 0;
      scoreText.innerHTML = 'النقاط: 0';
      randomFood();
      clearInterval(game);
      game = setInterval(draw, 150);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -15; }
      if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 15; }
      if (e.key === 'ArrowLeft' && dx === 0) { dx = -15; dy = 0; }
      if (e.key === 'ArrowRight' && dx === 0) { dx = 15; dy = 0; }
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0 && dx === 0) { dx = 15; dy = 0; }
        else if (diffX < 0 && dx === 0) { dx = -15; dy = 0; }
      } else {
        if (diffY > 0 && dy === 0) { dx = 0; dy = 15; }
        else if (diffY < 0 && dy === 0) { dx = 0; dy = -15; }
      }
    });

    randomFood();
    startGame();
  </script>
</body>
</html>
